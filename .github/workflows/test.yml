name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        # 테스트가 chart 모듈을 import 하므로 matplotlib(chart extra)도 설치
        run: pip install -r requirements.txt "matplotlib>=3.8.0" pytest pytest-cov

      - name: Run tests with coverage
        # 단일 실행으로 리포트 출력과 임계값 검사를 동시에 수행 (중복 실행 제거)
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=50
